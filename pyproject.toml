[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compxctl"
version = "4.3.0"
description = "Polling rate and DPI for CompX / Ardor Gaming mice on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No dependencies and no optional ones: the device commands talk to /dev/hidrawN
# through fcntl.ioctl, which is the standard library. There is nothing to
# install beyond Python itself — the test suite enforces that by reading this
# module's own AST.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
compxctl = "compxctl:main"

[tool.setuptools]
py-modules = ["compxctl"]
