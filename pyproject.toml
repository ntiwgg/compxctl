[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compxctl"
version = "1.1.0"
description = "Control polling rate and DPI of CompX / Ardor Gaming mice on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["hidapi", "pyusb", "evdev"]

[project.scripts]
compxctl = "compxctl:main"

[tool.setuptools]
py-modules = ["compxctl"]
