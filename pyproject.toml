[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compxctl"
version = "2.0.0"
description = "Polling rate and DPI for CompX / Ardor Gaming mice on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# `rate` needs nothing but the standard library. pyusb is required only by the
# device commands (dpi, status, battery, probe, rate device), so it is an extra
# rather than a hard dependency.
dependencies = []

[project.optional-dependencies]
device = ["pyusb"]
test = ["pytest"]

[project.scripts]
compxctl = "compxctl:main"

[tool.setuptools]
py-modules = ["compxctl"]
