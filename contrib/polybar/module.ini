; Polybar module for a CompX mouse — drop into your bar's config
; (~/.config/polybar/config.ini) and add `compx` to modules-right.
;
; Needs compx-status from this directory in PATH (~/.local/bin/compx-status, the
; file two folders up). It runs `compxctl status --json --tries 1
; --timeout-ms 150` and prints one short line:
;
;   🖱️ 100% · 400 DPI     usually
;   ⚡ 100% · 400 DPI      while charging
;   🖱️ —                  when the mouse is asleep or away
;
; A mouse that is asleep is a state, not an error: the module keeps its place in
; the bar and says so, instead of emptying itself or waiting out the defaults.

[module/compx]
type = custom/script
exec = compx-status
; The script answers in ~70 ms; 10 s is plenty and keeps the radio quiet.
interval = 10
; Left click: the DPI table in a terminal. Middle click: the interactive screen.
; Replace `foot -e` with your terminal (`alacritty -e`, `kitty`, `xterm -e`, …):
; a bar has no terminal of its own to hand a full-screen program.
click-left = foot -e compxctl dpi list
click-middle = foot -e compxctl tui
format = <label>
label = %output%
; If the bar is narrow, the same adapter with a shorter wish:
;   exec = compx-status --format waybar   -> no: that is JSON for Waybar, not text
; Instead trim the panel text in the adapter, or use the tool directly:
;   exec = compxctl status --json --tries 1 --timeout-ms 150
; and read it with jq/python in your own one-liner.
