name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests (no hardware, no /dev/hidraw, no root)
        run: |
          pip install pytest
          pytest -v

      - name: Packaging installs the console script
        run: |
          pip install .
          compxctl --version

      - name: Every command must run on a bare interpreter
        run: |
          # The promise is "standard library only, no packages at all", and the
          # test suite enforces it by reading compxctl.py's own AST. This step
          # proves the other half: the commands actually start and fail cleanly
          # instead of dying on a missing import.
          #
          # `set +e`: with no CompX mouse on a runner, exit status 1 is the
          # correct answer, and Actions runs this shell with -e.
          set +e
          python compxctl.py --version
          for command in "rate" "rate --json" "status --json" "battery" "dpi list"; do
            echo "--- compxctl $command"
            # shellcheck disable=SC2086
            python compxctl.py $command
            status=$?
            # 0 = a mouse was found; 1 = no CompX mouse on this runner (expected).
            if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
              echo "::error::unexpected exit status $status for: $command"
              exit 1
            fi
          done
